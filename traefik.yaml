services:
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.useBindPortIP=true"
      - "--providers.docker.network=internal"
      - "--entrypoints.web.address=:80"
    networks:
      - internal
    ports:
      - "80:80"
      - "9000:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
networks:
  internal:
    driver: bridge